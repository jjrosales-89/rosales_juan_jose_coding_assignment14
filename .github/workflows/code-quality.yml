name: Portfolio CI Pipeline

on:
  push:
  pull_request:

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Build React production site
        run: npm run build

      - name: Build production Storybook
        run: npm run build-storybook

      - name: Build Docker production image
        run: docker build -t rosales_juan_jose_coding_assignment14 .
